<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Full Record</title>
<meta name="description" content="Complete official transcripts, exactly as published.">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<style>
  :root{
    --paper:#FBFAF6;
    --ink:#14181C;
    --soft:#5C6670;
    --rule:#DCD6C8;
    --seal:#1E3A52;
    --stamp:#7A5C2E;
    --hit:#FFE9A8;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 18px 80px}

  /* ---- masthead ---- */
  header.top{border-bottom:3px double var(--rule);padding:26px 0 16px;margin-bottom:18px}
  h1{
    font-size:31px;line-height:1.05;margin:0;letter-spacing:-.02em;font-weight:800;
  }
  .tag{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
       color:var(--seal);margin-top:9px}
  .statusline{font-family:var(--mono);font-size:11.5px;color:var(--soft);margin-top:12px}

  /* ---- search ---- */
  .searchbox{position:relative;margin:16px 0 8px}
  input[type=search]{
    width:100%;font:inherit;padding:13px 14px;border:1.5px solid var(--rule);
    border-radius:4px;background:#fff;color:var(--ink);-webkit-appearance:none
  }
  input[type=search]:focus{outline:3px solid var(--seal);outline-offset:1px;border-color:var(--seal)}
  .deep{display:flex;align-items:center;gap:9px;font-size:14.5px;color:var(--soft);margin:10px 0 4px}
  .deep input{width:19px;height:19px;accent-color:var(--seal)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 4px}
  .chip{
    font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;padding:6px 10px;
    border:1px solid var(--rule);background:#fff;border-radius:999px;color:var(--soft);cursor:pointer
  }
  .chip[aria-pressed="true"]{background:var(--seal);border-color:var(--seal);color:#fff}
  .chip:focus-visible{outline:3px solid var(--seal);outline-offset:2px}
  .count{font-family:var(--mono);font-size:12px;color:var(--soft);margin:14px 0 6px}

  /* ---- record cards ---- */
  ul.list{list-style:none;margin:0;padding:0}
  li.rec{border-top:1px solid var(--rule);padding:18px 0}
  li.rec:last-child{border-bottom:1px solid var(--rule)}
  .rec button.open{
    display:block;width:100%;text-align:left;background:none;border:0;padding:0;
    font:inherit;color:inherit;cursor:pointer
  }
  .rec button.open:focus-visible{outline:3px solid var(--seal);outline-offset:3px}
  .rtitle{font-size:19px;font-weight:700;line-height:1.3;margin:0 0 8px}
  .rec button.open:hover .rtitle{text-decoration:underline;text-underline-offset:3px}
  .snip{font-size:15px;color:var(--soft);margin:0 0 11px}

  /* signature element: the provenance strip, printed on the face of every record */
  .prov{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--stamp);border-left:3px solid var(--stamp);padding-left:9px;
    display:flex;flex-wrap:wrap;gap:4px 14px
  }
  .prov b{font-weight:500;color:var(--soft)}

  /* ---- reading view ---- */
  .back{
    font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    background:none;border:0;padding:10px 0;color:var(--seal);cursor:pointer
  }
  .back:focus-visible{outline:3px solid var(--seal);outline-offset:2px}
  .doc h2{font-size:24px;line-height:1.25;margin:6px 0 12px}
  .srclink{
    display:inline-block;font-family:var(--mono);font-size:12.5px;color:var(--seal);
    word-break:break-all;margin-bottom:16px
  }
  pre.transcript{
    white-space:pre-wrap;word-wrap:break-word;font-family:Georgia,"Times New Roman",serif;
    font-size:17.5px;line-height:1.7;margin:0;background:#fff;border:1px solid var(--rule);
    border-radius:4px;padding:18px
  }
  mark{background:var(--hit);color:inherit;padding:0 1px}
  .pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0 0}
  .pager button{
    font:inherit;font-size:15px;padding:11px 16px;border:1.5px solid var(--seal);
    background:#fff;color:var(--seal);border-radius:4px;cursor:pointer
  }
  .pager button[disabled]{opacity:.35;cursor:default}
  .pager button:focus-visible{outline:3px solid var(--seal);outline-offset:2px}
  .pgnum{font-family:var(--mono);font-size:12px;color:var(--soft)}

  /* ---- empty / error ---- */
  .note{border:1px solid var(--rule);background:#fff;border-radius:4px;padding:18px;margin:20px 0}
  .note h3{margin:0 0 8px;font-size:17px}
  .note p{margin:0 0 8px;font-size:15.5px;color:var(--soft)}
  .note p:last-child{margin-bottom:0}
  footer{border-top:3px double var(--rule);margin-top:34px;padding-top:16px;
         font-family:var(--mono);font-size:11.5px;color:var(--soft);line-height:1.8}
  a{color:var(--seal)}
  @media (prefers-reduced-motion:no-preference){
    li.rec{animation:fade .25s ease both}
    @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1>The Full Record</h1>
    <div class="tag">Every word, worldwide, zero opinion</div>
    <div class="statusline" id="status">Loading the archive…</div>
  </header>

  <main id="main"></main>

  <footer>
    Nothing here is summarised, shortened or rewritten.<br>
    No record is stored without a direct link to the source it came from.<br>
    <span id="foot-count"></span>
  </footer>
</div>

<script>
(function () {
  "use strict";

  var PAGE_CHARS = 6000;
  var state = { records: [], generated: null, query: "", deep: false, source: "all",
                deepText: {}, deepReady: false, deepLoading: false, view: null, page: 0 };

  var main = document.getElementById("main");
  var statusEl = document.getElementById("status");

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function niceDate(iso) {
    if (!iso) return "date not given";
    var d = new Date(iso);
    if (isNaN(d)) return "date not given";
    return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }

  function highlight(text, q) {
    var safe = esc(text);
    if (!q) return safe;
    var needle = q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    return safe.replace(new RegExp("(" + needle + ")", "gi"), "<mark>$1</mark>");
  }

  // ---------- load ----------
  fetch("index.json", { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("index.json returned " + r.status); return r.json(); })
    .then(function (data) {
      state.records = data.records || [];
      state.generated = data.generated;
      statusEl.textContent =
        state.records.length + " transcripts · last collected " + niceDate(data.generated);
      document.getElementById("foot-count").textContent =
        "Archive holds " + state.records.length + " transcripts.";
      render();
    })
    .catch(function (e) {
      statusEl.textContent = "The archive could not be read.";
      main.innerHTML =
        '<div class="note"><h3>No archive file found</h3>' +
        "<p>The page looked for <b>index.json</b> next to itself and got: " + esc(e.message) + "</p>" +
        "<p>That file is written by the collector. If it has never run, there is nothing to read yet. " +
        "Run the collector once, then reload this page.</p></div>";
    });

  // ---------- searching ----------
  function matches(rec) {
    if (state.source !== "all" && rec.sourceId !== state.source) return false;
    var q = state.query.trim().toLowerCase();
    if (!q) return true;
    if ((rec.title + " " + rec.snippet + " " + rec.sourceName).toLowerCase().indexOf(q) > -1) return true;
    if (state.deep && state.deepText[rec.id]) {
      return state.deepText[rec.id].indexOf(q) > -1;
    }
    return false;
  }

  function loadAllText() {
    if (state.deepReady || state.deepLoading) return;
    state.deepLoading = true;
    render();
    var jobs = state.records.map(function (r) {
      return fetch("records/" + r.id + ".json", { cache: "force-cache" })
        .then(function (res) { return res.ok ? res.json() : null; })
        .then(function (d) { if (d && d.text) state.deepText[r.id] = d.text.toLowerCase(); })
        .catch(function () {});
    });
    Promise.all(jobs).then(function () {
      state.deepLoading = false;
      state.deepReady = true;
      render();
    });
  }

  // ---------- views ----------
  function render() {
    if (state.view) return renderDoc();
    renderList();
  }

  function sourceList() {
    var seen = {}, out = [];
    state.records.forEach(function (r) {
      if (!seen[r.sourceId]) { seen[r.sourceId] = true; out.push({ id: r.sourceId, name: r.sourceName }); }
    });
    return out;
  }

  function renderList() {
    var found = state.records.filter(matches);
    var html = "";

    html += '<div class="searchbox"><input type="search" id="q" placeholder="Search transcripts" ' +
            'value="' + esc(state.query) + '" autocomplete="off" aria-label="Search transcripts"></div>';

    html += '<label class="deep"><input type="checkbox" id="deep"' + (state.deep ? " checked" : "") + '>' +
            "<span>Search inside the full text, not just titles" +
            (state.deepLoading ? " — loading…" : (state.deep && state.deepReady ? " — ready" : "")) +
            "</span></label>";

    var srcs = sourceList();
    if (srcs.length > 1) {
      html += '<div class="chips">';
      html += '<button class="chip" data-src="all" aria-pressed="' + (state.source === "all") + '">All sources</button>';
      srcs.forEach(function (s) {
        html += '<button class="chip" data-src="' + esc(s.id) + '" aria-pressed="' +
                (state.source === s.id) + '">' + esc(s.name) + "</button>";
      });
      html += "</div>";
    }

    if (!state.records.length) {
      html += '<div class="note"><h3>The archive is empty</h3>' +
              "<p>The collector has not saved anything yet. Run it once, then reload.</p></div>";
    } else {
      html += '<div class="count">' + found.length + " of " + state.records.length + " transcripts</div>";
      if (!found.length) {
        html += '<div class="note"><h3>Nothing matched</h3><p>Try fewer words. ' +
                "Only what has already been collected can be found — this searches the archive, not the internet.</p></div>";
      }
      html += '<ul class="list">';
      found.forEach(function (r) {
        html += '<li class="rec"><button class="open" data-id="' + esc(r.id) + '">' +
          '<p class="rtitle">' + highlight(r.title, state.query) + "</p>" +
          '<p class="snip">' + highlight(r.snippet.slice(0, 220) + "…", state.query) + "</p>" +
          '<div class="prov">' +
            "<span><b>Source:</b> " + esc(r.sourceName) + "</span>" +
            "<span><b>Published:</b> " + esc(niceDate(r.published)) + "</span>" +
            "<span><b>Saved:</b> " + esc(niceDate(r.collected)) + "</span>" +
            "<span><b>Words kept by:</b> " + esc(r.method) + "</span>" +
            "<span><b>Length:</b> " + r.chars.toLocaleString() + " characters</span>" +
          "</div></button></li>";
      });
      html += "</ul>";
    }

    main.innerHTML = html;

    var q = document.getElementById("q");
    if (q) {
      q.addEventListener("input", function (e) {
        var pos = e.target.selectionStart;
        state.query = e.target.value;
        renderList();
        var again = document.getElementById("q");
        again.focus();
        try { again.setSelectionRange(pos, pos); } catch (x) {}
      });
    }
    var d = document.getElementById("deep");
    if (d) d.addEventListener("change", function (e) {
      state.deep = e.target.checked;
      if (state.deep) loadAllText(); else renderList();
    });
    Array.prototype.forEach.call(main.querySelectorAll(".chip"), function (b) {
      b.addEventListener("click", function () { state.source = b.getAttribute("data-src"); renderList(); });
    });
    Array.prototype.forEach.call(main.querySelectorAll("button.open"), function (b) {
      b.addEventListener("click", function () { openDoc(b.getAttribute("data-id")); });
    });
  }

  function openDoc(id) {
    var meta = null;
    state.records.forEach(function (r) { if (r.id === id) meta = r; });
    if (!meta) return;
    state.view = { meta: meta, text: null, error: null };
    state.page = 0;
    renderDoc();
    fetch("records/" + id + ".json", { cache: "force-cache" })
      .then(function (r) { if (!r.ok) throw new Error("record file returned " + r.status); return r.json(); })
      .then(function (d) { state.view.text = d.text; renderDoc(); })
      .catch(function (e) { state.view.error = e.message; renderDoc(); });
  }

  function renderDoc() {
    var v = state.view, m = v.meta;
    var html = '<button class="back" id="back">&larr; Back to all transcripts</button><div class="doc">';
    html += "<h2>" + esc(m.title) + "</h2>";
    html += '<div class="prov" style="margin-bottom:14px">' +
      "<span><b>Source:</b> " + esc(m.sourceName) + "</span>" +
      "<span><b>Published:</b> " + esc(niceDate(m.published)) + "</span>" +
      "<span><b>Saved:</b> " + esc(niceDate(m.collected)) + "</span>" +
      "<span><b>Words kept by:</b> " + esc(m.method) + "</span></div>";
    html += '<a class="srclink" href="' + esc(m.url) + '" rel="noopener noreferrer">Read it at the source: ' + esc(m.url) + "</a>";

    if (v.error) {
      html += '<div class="note"><h3>This transcript could not be opened</h3><p>' + esc(v.error) + "</p></div>";
    } else if (v.text === null) {
      html += '<div class="note"><p>Opening the transcript…</p></div>';
    } else {
      var pages = Math.max(1, Math.ceil(v.text.length / PAGE_CHARS));
      if (state.page >= pages) state.page = pages - 1;
      var slice = v.text.slice(state.page * PAGE_CHARS, (state.page + 1) * PAGE_CHARS);
      html += "<pre class='transcript'>" + highlight(slice, state.query) + "</pre>";
      if (pages > 1) {
        html += '<div class="pager"><button id="prev"' + (state.page === 0 ? " disabled" : "") + ">Previous</button>" +
          '<span class="pgnum">Page ' + (state.page + 1) + " of " + pages + "</span>" +
          '<button id="next"' + (state.page === pages - 1 ? " disabled" : "") + ">Next</button></div>";
      }
    }
    html += "</div>";
    main.innerHTML = html;
    window.scrollTo(0, 0);

    document.getElementById("back").addEventListener("click", function () {
      state.view = null; renderList();
    });
    var p = document.getElementById("prev"), n = document.getElementById("next");
    if (p) p.addEventListener("click", function () { state.page--; renderDoc(); });
    if (n) n.addEventListener("click", function () { state.page++; renderDoc(); });
  }
})();
</script>
</body>
</html>
