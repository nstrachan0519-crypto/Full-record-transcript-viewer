# THE FULL RECORD — daily collection
#
# WHAT THIS FILE IS, IN PLAIN LANGUAGE
# This tells GitHub: once a day, on your computers, run our collector, and
# save whatever new transcripts it found back into this repository.
#
# Saving them back is what creates the dated public trail. Every run that
# finds something new leaves a permanent, timestamped entry in the history.
#
# WHERE THIS FILE GOES
#   .github/workflows/collect.yml
# The folder name and the .github part matter. GitHub only looks there.

name: Collect the record

on:
  # Once a day. Times are UTC — GitHub does not use your local time.
  # 11:00 UTC is early morning in the United States.
  #
  # HONEST NOTE: GitHub gives no guarantee about timing. Delays of ten to
  # thirty minutes are normal and longer happens. Do not promise readers an
  # exact update time.
  schedule:
    - cron: "0 11 * * *"

  # Lets you run it by hand from the Actions tab.
  # KEEP THIS. A new schedule often will not start until you have run the
  # workflow manually at least once — a known GitHub quirk.
  workflow_dispatch:

# The job needs permission to write back to the repository.
permissions:
  contents: write

# If a run is already going, do not start a second one on top of it.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Get the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check the collector still passes its own tests
        # If the tests fail, stop here. Never publish from code that is
        # failing its checks.
        run: node selftest.mjs

      - name: Collect today's records
        run: node collect.mjs

      - name: Save anything new into the repository
        run: |
          git config user.name "the-full-record-collector"
          git config user.email "collector@users.noreply.github.com"

          # If nothing changed, stop quietly. An empty commit would add noise
          # to the history, and the history is the point.
          if git diff --quiet -- docs/data; then
            echo "Nothing new today. No commit made."
            exit 0
          fi

          git add docs/data
          git commit -m "Record: $(date -u '+%Y-%m-%d')"
          git push
