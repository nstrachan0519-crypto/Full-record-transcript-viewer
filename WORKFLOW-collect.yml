# The Full Record — the daily job.
# This file must end up at: .github/workflows/collect.yml
name: Collect the record

on:
  schedule:
    - cron: "20 6 * * *"   # every day, about 06:20 UTC. GitHub does not promise exact timing.
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed so the job can save what it collected

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run the collector
        run: node collect.mjs

      - name: Save what it found
        run: |
          git config user.name "the-full-record-collector"
          git config user.email "collector@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "Nothing new today. Not saving."
          else
            git commit -m "Collected $(date -u +'%Y-%m-%d')"
            git push
          fi
